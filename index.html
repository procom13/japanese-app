<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일본어 학습지</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일본어 학습지">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2B4C9B">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1F6;--card:#FFFFFF;--fg:#17233B;--muted:#5C6B86;--line:#D5DCE8;
  --accent:#2B4C9B;--accent-fg:#FFFFFF;--accent-soft:#DDE6F9;--good:#1F7A52;--good-bg:#DDF2E7;
  --font-ko:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-jp:'Noto Sans JP','Hiragino Sans','Yu Gothic','Noto Sans KR',sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E1423;--card:#171F33;--fg:#E7ECF7;--muted:#9AA8C4;--line:#2A3550;
    --accent:#8CAAF5;--accent-fg:#0E1423;--accent-soft:#222E4D;--good:#6FD3A0;--good-bg:#14352A;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E1423;--card:#171F33;--fg:#E7ECF7;--muted:#9AA8C4;--line:#2A3550;
  --accent:#8CAAF5;--accent-fg:#0E1423;--accent-soft:#222E4D;--good:#6FD3A0;--good-bg:#14352A;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--font-ko)}
main{max-width:480px;margin:0 auto;padding-block:20px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:12px}
h1{font-size:24px;margin:0;line-height:1.25}
.sub{margin:0 0 4px;color:var(--muted);font-size:14px}
.day{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px 16px;text-decoration:none;color:var(--fg);min-height:84px}
.day:active{transform:scale(.99)}
.day:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.num{width:52px;height:52px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1.1;text-align:center}
.num b{display:block;font-size:20px}
.day.today .num{background:var(--accent);color:var(--accent-fg)}
.info{min-width:0}
.info strong{display:block;font-size:16px}
.kana{font:500 20px/1.3 var(--font-jp);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info small{display:block;color:var(--muted);font-size:13px}
.go{color:var(--muted);font-size:20px}
.done{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:var(--good-bg);color:var(--good);font-size:12px;font-weight:700;vertical-align:2px}
.next{border-style:dashed;opacity:.7}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:8px 0 0}
</style>
</head>
<body>
<main>
  <div>
    <h1>일본어 학습지</h1>
    <p class="sub">하루 15분 · 히라가나부터 J-pop까지</p>
  </div>
  <div id="list"></div>
  <p class="foot" id="credit">음성: VOICEVOX:春日部つむぎ · 冥鳴ひまり · もち子さん · 青山龍星</p>
</main>
<script>
(function(){
  var DAYS=[
    {n:1,href:'day1.html',title:'히라가나 あ행 · か행',kana:'あいうえお かきくけこ',desc:'첫 10글자'},
    {n:2,href:'day2.html',title:'히라가나 さ행 · た행',kana:'さしすせそ たちつてと',desc:'Day 1 복습 퀴즈 포함'}
  ];
  var NEXT={n:3,title:'히라가나 な행 · は행',kana:'なにぬねの はひふへほ',desc:'준비 중'};
  var last=DAYS[DAYS.length-1].n;
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
  var html=DAYS.slice().reverse().map(function(d){
    var today=d.n===last;
    return '<a class="day'+(today?' today':'')+'" href="'+d.href+'">'+
      '<span class="num">Day<b>'+d.n+'</b></span>'+
      '<span class="info"><strong>'+esc(d.title)+'</strong>'+
      '<span class="kana" lang="ja">'+esc(d.kana)+'</span><small>'+esc(d.desc)+'</small></span>'+
      '<span class="go" aria-hidden="true">›</span></a>';
  }).join('');
  html='<div style="display:flex;flex-direction:column;gap:10px">'+
    '<div class="day next" aria-disabled="true"><span class="num">Day<b>'+NEXT.n+'</b></span>'+
    '<span class="info"><strong>'+esc(NEXT.title)+'</strong><span class="kana" lang="ja">'+esc(NEXT.kana)+'</span><small>'+esc(NEXT.desc)+'</small></span><span></span></div>'+
    html+'</div>';
  document.getElementById('list').innerHTML=html;
})();
</script>
</body>
</html>
